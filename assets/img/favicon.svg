<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96B55" />
      <stop offset="100%" stop-color="#A52A18" />
    </linearGradient>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCDAD2" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F69D8A" />
      <stop offset="100%" stop-color="#D95338" />
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2735C" />
      <stop offset="100%" stop-color="#9E2A14" />
    </linearGradient>
    <linearGradient id="goldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFA726" />
    </linearGradient>
  </defs>
  
  <!-- Outer Badge Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Faceted Mineral Gemstone / Crystal -->
  <!-- Top Facets -->
  <polygon points="32,12 47,23 32,31 17,23" fill="url(#facetTop)" />
  <polygon points="32,12 32,31 17,23" fill="#FFFFFF" opacity="0.35" />
  
  <!-- Lower Pavilion Facets -->
  <polygon points="17,23 32,31 32,52" fill="url(#facetLeft)" />
  <polygon points="47,23 32,31 32,52" fill="url(#facetRight)" />
  
  <!-- Golden Core Center (Mineral Ore Spark) -->
  <polygon points="32,22 38,28 32,36 26,28" fill="url(#goldFacet)" />
  <circle cx="32" cy="28" r="1.8" fill="#FFFFFF" />
  
  <!-- Geometric Edges -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />
  <line x1="17" y1="23" x2="47" y2="23" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4" />
</svg>