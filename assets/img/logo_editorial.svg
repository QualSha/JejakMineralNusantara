<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="edBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="edFacetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="edFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="edFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Seal Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#edBgGrad)" />
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
  
  <!-- Faceted Editorial Mineral Gemstone -->
  <!-- Top Facets -->
  <polygon points="32,13 47,23 32,31 17,23" fill="url(#edFacetTop)" />
  <polygon points="32,13 32,31 17,23" fill="#ffffff" opacity="0.4" />
  
  <!-- Lower Pavilion Facets -->
  <polygon points="17,23 32,31 32,51" fill="url(#edFacetLeft)" />
  <polygon points="47,23 32,31 32,51" fill="url(#edFacetRight)" />
  
  <!-- Core Star / Mineral Spark -->
  <polygon points="32,23 37,28 32,34 27,28" fill="#ffffff" />
  <circle cx="32" cy="28.5" r="1.5" fill="#0f172a" />
  
  <!-- Precision Editorial Geometric Lines -->
  <line x1="32" y1="13" x2="32" y2="51" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <line x1="17" y1="23" x2="47" y2="23" stroke="#ffffff" stroke-width="0.8" opacity="0.5" />
</svg>
