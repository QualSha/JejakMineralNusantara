<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug - Container Height Check</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fafafa; font-family: sans-serif; }

    .debug-section {
      border: 2px solid #f59e0b;
      margin: 20px;
      padding: 0;
      border-radius: 8px;
      overflow: hidden;
    }

    .debug-label {
      background: #f59e0b;
      color: #000;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    /* EXACT SAME CSS AS MAIN SITE */
    :root {
      --nav-h: 56px;
      --c-surface: #111111;
      --c-surface-2: #161616;
      --c-line: #27272a;
    }

    .stage-sticky {
      background: var(--c-surface);
      border: 1px solid var(--c-line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }

    @media (min-width: 1024px) {
      .stage-sticky {
        position: sticky;
        top: calc(var(--nav-h) + 16px);
        height: calc(100vh - var(--nav-h) - 32px);
        min-height: 560px;
        max-height: 860px;
      }
    }

    @media (max-width: 1023px) {
      .stage-sticky {
        position: sticky;
        top: var(--nav-h);
        height: 62vh;
        min-height: 380px;
        z-index: 200;
      }
    }

    .stage-bar {
      display: flex; align-items: center;
      height: 44px; flex-shrink: 0;
      padding: 0 20px;
      background: var(--c-surface-2);
      border-bottom: 1px solid var(--c-line);
    }

    .stage-canvas {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: var(--c-surface);
    }

    .vis-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .vis-layer.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 3;
    }

    .chart-canvas, #map-test, #chart-test {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>
<body>

<div id="height-report" style="background:#1a1a1a;padding:16px 20px;margin:20px;border-radius:8px;border:1px solid #27272a;font-family:monospace;font-size:12px;line-height:1.8;"></div>

<div class="debug-section" style="margin:20px;">
  <div class="debug-label">Test 1: stage-sticky (should fill height from media query)</div>
  <div class="stage-sticky" id="test-stage">
    <div class="stage-bar">Stage Bar (44px fixed)</div>
    <div class="stage-canvas" id="test-canvas">
      <div class="vis-layer active" id="test-layer">
        <div id="chart-test" class="chart-canvas"></div>
      </div>
    </div>
  </div>
</div>

<div class="debug-section" style="margin:20px;">
  <div class="debug-label">Test 2: Explicit height fallback (500px)</div>
  <div class="stage-sticky" style="height:500px;position:relative;">
    <div class="stage-bar">Stage Bar</div>
    <div class="stage-canvas" id="test-canvas-2">
      <div class="vis-layer active" id="test-layer-2">
        <div id="chart-test-2" class="chart-canvas"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
function measureEl(id) {
  const el = document.getElementById(id);
  if (!el) return 'NOT FOUND';
  const rect = el.getBoundingClientRect();
  return `w:${Math.round(rect.width)} h:${Math.round(rect.height)} (offsetH:${el.offsetHeight})`;
}

document.addEventListener('DOMContentLoaded', () => {
  const report = document.getElementById('height-report');
  
  setTimeout(() => {
    const lines = [
      `viewport: ${window.innerWidth}x${window.innerHeight}`,
      `test-stage: ${measureEl('test-stage')}`,
      `test-canvas: ${measureEl('test-canvas')}`,
      `test-layer: ${measureEl('test-layer')}`,
      `chart-test: ${measureEl('chart-test')}`,
      '',
      '--- ECharts Init Test ---',
    ];
    
    // Test 1: auto height
    const dom1 = document.getElementById('chart-test');
    const h1 = dom1 ? dom1.offsetHeight : 0;
    lines.push(`chart-test offsetHeight: ${h1}`);
    
    if (h1 > 10) {
      try {
        const ec1 = echarts.init(dom1, 'dark');
        ec1.setOption({ series: [{ type: 'pie', radius: '70%', data: [{name:'A',value:10},{name:'B',value:20}] }] });
        lines.push('Test 1 ECharts: SUCCESS');
      } catch(e) { lines.push('Test 1 ECharts: ERROR - ' + e.message); }
    } else {
      lines.push('Test 1 ECharts: SKIPPED (height 0)');
    }
    
    // Test 2: explicit height
    const dom2 = document.getElementById('chart-test-2');
    const h2 = dom2 ? dom2.offsetHeight : 0;
    lines.push(`chart-test-2 offsetHeight: ${h2}`);
    
    if (h2 > 10) {
      try {
        const ec2 = echarts.init(dom2, 'dark');
        ec2.setOption({ series: [{ type: 'pie', radius: '70%', data: [{name:'X',value:5},{name:'Y',value:15}] }] });
        lines.push('Test 2 ECharts: SUCCESS');
      } catch(e) { lines.push('Test 2 ECharts: ERROR - ' + e.message); }
    } else {
      lines.push('Test 2 ECharts: SKIPPED (height 0)');
    }
    
    report.innerHTML = lines.map(l => l ? `<div>${l}</div>` : '<br>').join('');
  }, 300);
});
</script>
</body>
</html>
